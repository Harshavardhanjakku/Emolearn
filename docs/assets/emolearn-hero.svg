<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">EmoLearn hero illustration</title>
  <desc id="desc">A glowing learner profile connected to emotion signals and adaptive learning actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="180" cy="90" r="90" fill="#7c3aed" opacity=".25" filter="url(#blur)"/>
  <circle cx="1000" cy="335" r="100" fill="#06b6d4" opacity=".2" filter="url(#blur)"/>
  <g fill="none" stroke="url(#glow)" stroke-width="3" opacity=".8">
    <path d="M305 215 C390 215 400 115 480 115"/>
    <path d="M305 215 C390 215 400 315 480 315"/>
    <path d="M695 115 C780 115 810 175 895 175"/>
    <path d="M695 315 C780 315 810 255 895 255"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <text x="600" y="67" fill="#f8fafc" font-size="32" font-weight="700">Sense. Understand. Adapt.</text>
    <text x="600" y="98" fill="#c4b5fd" font-size="16">An emotion-aware learning loop for more human tutoring</text>
    <g transform="translate(95 145)">
      <rect width="210" height="140" rx="22" fill="#1e1b4b" stroke="#8b5cf6"/>
      <text x="105" y="48" fill="#ddd6fe" font-size="38">◉</text>
      <text x="105" y="88" fill="#fff" font-size="18" font-weight="600">Learner signals</text>
      <text x="105" y="115" fill="#a5b4fc" font-size="14">face · voice · mouse</text>
    </g>
    <g transform="translate(480 85)">
      <rect width="215" height="260" rx="28" fill="#172554" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="107" cy="87" r="48" fill="#312e81" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="90" cy="80" r="6" fill="#e0f2fe"/><circle cx="124" cy="80" r="6" fill="#e0f2fe"/>
      <path d="M87 108 Q107 125 128 108" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round"/>
      <text x="107" y="165" fill="#fff" font-size="18" font-weight="600">Emotion engine</text>
      <text x="107" y="192" fill="#a5f3fc" font-size="14">merge → context → action</text>
      <text x="107" y="224" fill="#67e8f9" font-size="14">FastAPI + local models</text>
    </g>
    <g transform="translate(895 125)">
      <rect width="210" height="180" rx="22" fill="#042f3b" stroke="#22d3ee"/>
      <text x="105" y="48" fill="#cffafe" font-size="34">✦</text>
      <text x="105" y="88" fill="#fff" font-size="18" font-weight="600">Adaptive tutor</text>
      <text x="105" y="117" fill="#a5f3fc" font-size="14">explain · quiz · play</text>
      <text x="105" y="143" fill="#a5f3fc" font-size="14">summarize · reset</text>
    </g>
  </g>
</svg>
